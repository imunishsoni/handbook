name: Cross-Platform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build macOS (Universal 2 Native)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate App Icons
        run: npm run icon

      - name: Compile Native Swift Machine Code App
        run: ./scripts/build-native.sh

      - name: Build macOS DMG and ZIP Packages
        run: npm run dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Handbook-macOS
          path: |
            dist/Handbook-mac-universal.dmg
            dist/Handbook-mac-universal.zip
            dist/Handbook-mac-arm64.dmg
            dist/Handbook-mac-x86_64.dmg
          retention-days: 14

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Linux App
        run: |
          npx electron-packager . "Handbook" --platform=linux --arch=x64 --icon=assets/icon.png --out=dist --overwrite --prune=true --ignore=^/dist --ignore=^/build/icon.iconset
          cp bin/handbook dist/Handbook-linux-x64/handbook-cli
          cp assets/icon.png dist/Handbook-linux-x64/icon.png
          tar -czf dist/Handbook-linux-x64.tar.gz -C dist Handbook-linux-x64
          zip -r -q dist/Handbook-linux-x64.zip dist/Handbook-linux-x64

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Handbook-Linux-x64
          path: |
            dist/Handbook-linux-x64.tar.gz
            dist/Handbook-linux-x64.zip
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Package Windows App
        run: |
          npx electron-packager . "Handbook" --platform=win32 --arch=x64 --icon=build/icon.ico --out=dist --overwrite --prune=true --ignore=^/dist --ignore=^/build/icon.iconset
          Copy-Item "bin/handbook.cmd" "dist/Handbook-win32-x64/handbook.cmd"
          Compress-Archive -Path "dist/Handbook-win32-x64/*" -DestinationPath "dist/Handbook-windows-x64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Handbook-Windows-x64
          path: dist/Handbook-windows-x64.zip
          retention-days: 14
