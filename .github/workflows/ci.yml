name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build Native macOS App
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Native Swift App
        run: ./scripts/build-native.sh

      - name: Build DMG and ZIP Packages
        run: npm run dmg

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Handbook-macOS-arm64
          path: |
            dist/Handbook-mac-arm64.dmg
            dist/Handbook-mac-arm64.zip
          retention-days: 14
