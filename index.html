<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; font-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Handbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Title Bar (macOS hiddenInset with traffic light offset) -->
  <div id="titlebar">
    <div id="titlebar-drag"></div>
    <div id="titlebar-title">
      <span class="brand-mark">HANDBOOK</span>
      <span id="titlebar-doc"></span>
    </div>
  </div>

  <!-- Main Layout -->
  <div id="main-container">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-title">Workspace</span>
      </div>
      <div id="file-tree"></div>
    </div>

    <!-- Sidebar Resize Handle -->
    <div id="sidebar-resize-handle"></div>

    <!-- Editor Area -->
    <div id="editor-area">
      <!-- Tab Bar -->
      <div id="tab-bar">
        <div id="tabs"></div>
      </div>

      <!-- Editor Container -->
      <div id="editor-container">
        <!-- Welcome Screen -->
        <div id="welcome-screen">
          <div class="welcome-content">
            <svg class="welcome-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="hLeft" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8"/>
                  <stop offset="100%" stop-color="#4f46e5"/>
                </linearGradient>
                <linearGradient id="hRight" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#a855f7"/>
                  <stop offset="100%" stop-color="#ec4899"/>
                </linearGradient>
                <linearGradient id="hRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#2dd4bf"/>
                  <stop offset="100%" stop-color="#059669"/>
                </linearGradient>
              </defs>
              <path d="M 22 25 C 34 22, 47 25, 50 28 L 50 78 C 47 75, 34 72, 22 75 Z" fill="url(#hLeft)" />
              <path d="M 50 28 C 53 25, 66 22, 78 25 L 78 75 C 66 72, 53 75, 50 78 Z" fill="url(#hRight)" />
              <polygon points="48,27 52,27 52,82 50,80 48,82" fill="url(#hRibbon)" />
              <line x1="28" y1="36" x2="42" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
              <line x1="28" y1="44" x2="44" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
              <line x1="28" y1="52" x2="38" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
              <line x1="56" y1="36" x2="72" y2="36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
              <line x1="56" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
              <line x1="56" y1="52" x2="68" y2="52" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
            </svg>
            <h1>Handbook</h1>
            <p class="welcome-subtitle">Pure speed. Zero friction.</p>
            <div class="welcome-shortcuts">
              <div class="shortcut-group">
                <h3>Workspace</h3>
                <div class="shortcut" data-action="openFolder"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>O</kbd><span>Open Project Folder</span></div>
                <div class="shortcut" data-action="openFile"><kbd>⌘</kbd><kbd>O</kbd><span>Open File</span></div>
                <div class="shortcut" data-action="newFile"><kbd>⌘</kbd><kbd>N</kbd><span>New Draft</span></div>
              </div>
              <div class="shortcut-group">
                <h3>Commands</h3>
                <div class="shortcut" data-action="gotoFile"><kbd>⌘</kbd><kbd>P</kbd><span>Quick Find File</span></div>
                <div class="shortcut" data-action="commandPalette"><kbd>⌘</kbd><kbd>⇧</kbd><kbd>P</kbd><span>Command Palette</span></div>
                <div class="shortcut" data-action="gotoLine"><kbd>⌘</kbd><kbd>G</kbd><span>Jump to Line</span></div>
                <div class="shortcut" data-action="gotoSymbol"><kbd>⌘</kbd><kbd>R</kbd><span>Go to Symbol</span></div>
                <div class="shortcut" data-action="themePicker"><kbd>🎨</kbd><span>Color Theme</span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Monaco Editor Mount Point -->
        <div id="monaco-editor"></div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div id="status-bar">
    <div id="status-left">
      <span id="status-message"></span>
    </div>
    <div id="status-right">
      <span id="status-theme" title="Change Color Theme">🎨 Neutral</span>
      <span class="status-sep">|</span>
      <span id="status-position">Ln 1, Col 1</span>
      <span class="status-sep">|</span>
      <span id="status-indentation">Spaces: 4</span>
      <span class="status-sep">|</span>
      <span id="status-encoding">UTF-8</span>
      <span class="status-sep">|</span>
      <span id="status-language">Plain Text</span>
    </div>
  </div>

  <!-- Go-To Overlay (⌘P / ⌘⇧P / ⌘G) -->
  <div id="goto-overlay" class="hidden">
    <div id="goto-panel">
      <input type="text" id="goto-input" placeholder="Search files or commands…" autocomplete="off" spellcheck="false">
      <div id="goto-results"></div>
    </div>
  </div>

  <!-- Load Native Bridge, Monaco AMD loader, then the app -->
  <script src="./bridge.js"></script>
  <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
